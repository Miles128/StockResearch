version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://invesbao:invesbao@db:5432/invesbao
      REDIS_URL: redis://redis:6379/0
      USE_MOCK_LLM: "true"
      USE_MOCK_MARKET_DATA: "true"
      SECRET_KEY: dev-secret-key
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invesbao
      POSTGRES_PASSWORD: invesbao
      POSTGRES_DB: invesbao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
