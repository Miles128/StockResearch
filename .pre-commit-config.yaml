repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 用项目自带的 prettier（web/node_modules），与开发/构建环境版本一致，
  # 避免 mirrors-prettier 漂移导致提交时被反向重排。
  - repo: local
    hooks:
      - id: prettier
        name: prettier (web)
        entry: web/node_modules/.bin/prettier --write
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx|json|css|md)$

  - repo: local
    hooks:
      - id: pytest
        name: pytest (backend)
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      - id: web-build
        name: npm run build (frontend)
        entry: bash -c 'cd web && npm run build'
        language: system
        files: ^web/
        pass_filenames: false
        stages: [pre-push]
