# Fly.io — 香港区。首次: fly apps create stockresearch-api && fly volumes create stockresearch_data -r hkg -s 1
app = "stockresearch-api"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  USE_MOCK_LLM = "false"
  USE_MOCK_MARKET_DATA = "false"
  DATABASE_URL = "sqlite:////data/stockresearch.db"

[[mounts]]
  source = "stockresearch_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"
