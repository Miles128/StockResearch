[project]
name = "stockresearch"
version = "0.1.0"
description = "StockResearch — A-share AI investment research assistant with Multi-Agent architecture"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "akshare>=1.16.0",
    "efinance>=0.5.0",
    "tushare>=1.4.0",
    "fpdf2>=2.8.0",
    "slowapi>=0.1.9",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
stockresearch = "stockresearch.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockresearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: requires access to real third-party internet services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 delegated to ruff format; long Chinese prompt strings cannot be auto-wrapped
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["stockresearch"]
mypy_path = "src"

# 渐进式严格基线：保留核心类型检查（arg-type/assignment/return-value 等默认开启项），
# 关闭 strict 全开中当前代码库未达成的选项，后续随修复逐步收紧回 strict。
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true

# 无类型存根的第三方库（akshare/tushare/apscheduler 未提供 py.typed）
[[tool.mypy.overrides]]
module = ["akshare", "tushare", "apscheduler.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=3.5.0",
    "coverage>=7.15.3",
]
