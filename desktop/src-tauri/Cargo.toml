[package]
name = "stockresearch-desktop"
version = "0.1.0"
description = "StockResearch Tauri shell (macOS + Windows)"
authors = ["StockResearch"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "stockresearch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
