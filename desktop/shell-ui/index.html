<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockResearch</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(1200px 600px at 20% 0%, #1a56db22, transparent),
          radial-gradient(900px 500px at 90% 20%, #0f766e22, transparent),
          #0b1220;
        color: #e8eefc;
      }
      .card {
        text-align: center;
        padding: 2rem 2.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        opacity: 0.75;
        font-size: 0.95rem;
      }
      .pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #3b82f6;
        margin: 1.25rem auto 0;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.35);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>StockResearch</h1>
      <p>正在启动本地研究服务…</p>
      <div class="pulse" aria-hidden="true"></div>
    </div>
  </body>
</html>
